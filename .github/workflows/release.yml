# Release artefacts, built by independent jobs:
#
#   windows-dist    the Windows zip: the CLI tools, the shared library and the
#                   Geist Hardcopy Reader, with the Qt runtime it needs to start
#   linux-appimage  the reader as an AppImage, for amd64 and arm64
#   linux-spec      the BOO format specification as a PDF
#
# Pushing a tag publishes all of them to one GitHub Release, creating the
# release first if it does not exist. Running the workflow by hand builds and
# uploads them as run artifacts but publishes nothing, so they can be
# downloaded and checked before any tag is cut.
#
# The jobs run concurrently and any of them may be first to the release, so
# each treats "already created" as success rather than a collision.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Only the release job needs write access, and only on a tag.
permissions:
  contents: read

env:
  QT_VERSION: "6.8.1"
  QT_ARCH: win64_msvc2022_64

jobs:
  windows-dist:
    name: Windows x64 distribution
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # A tag names the release; a manual run is identified by its commit so
      # two hand-built zips are never confused for one another.
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME
            $publish = 'true'
          } else {
            $version = $env:GITHUB_SHA.Substring(0, 7)
            $publish = 'false'
          }
          "version=$version"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "publish=$publish"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=geist-$version-windows-x64" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version $version (publish a release: $publish)"

      # Qt is supplied here rather than by vcpkg: vcpkg's qtwebengine port is
      # a from-source Chromium build measured in hours. qtwebengine does not
      # pull qtwebchannel or qtpositioning in on its own, and omitting them
      # surfaces late as a missing-target error at configure time.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true

      # The root CMakeLists discovers the vcpkg toolchain from VCPKG_ROOT.
      # The runner image preinstalls it, but assert that rather than letting
      # a changed image surface as a confusing libpng/giflib failure.
      - name: Check vcpkg is present
        shell: pwsh
        run: |
          # GitHub-hosted Windows runners ship vcpkg but export it as
          # VCPKG_INSTALLATION_ROOT; VCPKG_ROOT is not set. The root
          # CMakeLists reads VCPKG_ROOT, so resolve one and export it for the
          # steps that follow.
          $root = $env:VCPKG_ROOT
          if (-not $root) { $root = $env:VCPKG_INSTALLATION_ROOT }
          if (-not $root -and (Test-Path 'C:/vcpkg')) { $root = 'C:/vcpkg' }
          if (-not $root) {
            throw "No vcpkg on this runner (checked VCPKG_ROOT, VCPKG_INSTALLATION_ROOT, C:/vcpkg); libgeist needs it for libpng/giflib."
          }

          $toolchain = Join-Path $root "scripts/buildsystems/vcpkg.cmake"
          if (-not (Test-Path $toolchain)) {
            throw "No vcpkg toolchain at $toolchain"
          }

          Write-Host "vcpkg root:      $root"
          Write-Host "vcpkg toolchain: $toolchain"
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # GEIST_BUILD_GUI=ON, never AUTO: AUTO would quietly skip the reader if
      # Qt were missing and ship a GUI-less zip that still looked successful.
      - name: Configure
        shell: pwsh
        run: |
          # The toolchain is passed explicitly rather than left to the root
          # CMakeLists' VCPKG_ROOT discovery, so a vcpkg problem fails here
          # with a clear message instead of as a missing libpng/giflib later.
          cmake -S . -B build -A x64 `
            -DGEIST_BUILD_GUI=ON `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      # MSVC generators are multi-config, so the configuration is chosen here
      # and the binaries land in build/Release and build/gui/Release.
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run tests
        shell: pwsh
        working-directory: build
        run: ctest --build-config Release --output-on-failure --parallel 4

      # The reader's directory is copied first because windeployqt has already
      # assembled the Qt runtime, QtWebEngineProcess.exe and its resource and
      # locale trees there. The CLI tools and the shared library join it, so
      # the zip is one flat directory a user can run from anywhere.
      - name: Assemble distribution
        shell: pwsh
        run: |
          $dist = "dist/${{ steps.version.outputs.name }}"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          # The reader first: windeployqt has already assembled the Qt
          # runtime, QtWebEngineProcess.exe and its resource trees there.
          Copy-Item -Path "build/gui/Release/*" -Destination $dist -Recurse -Force

          # Name what ships. build/Release also holds every test executable
          # and the benchmark, and a glob over *.exe sweeps all of them into
          # the distribution.
          $tools = @(
            'booinfo.exe', 'bootoc.exe', 'boorsrc.exe',
            'boorender.exe', 'bootrace.exe', 'boo2git.exe'
          )
          foreach ($tool in $tools) {
            Copy-Item -Path "build/Release/$tool" -Destination $dist -Force
          }
          Get-ChildItem -Path "build/Release" -Filter "*.dll" -File |
            Copy-Item -Destination $dist -Force

          # Apache-2.0 section 4 requires the licence to travel with the
          # binaries. Third-party notices for the bundled Qt, Chromium,
          # libpng and giflib are still outstanding.
          Copy-Item -Path "LICENSE" -Destination $dist -Force

          # Build by-products that have no business in a distribution.
          Get-ChildItem -Path $dist -Recurse -File |
            Where-Object { $_.Extension -in '.lib', '.exp', '.ilk', '.pdb' } |
            Remove-Item -Force

          Get-ChildItem -Path $dist -Recurse -File |
            ForEach-Object { $_.FullName.Substring((Resolve-Path $dist).Path.Length + 1) } |
            Sort-Object

      # A package that is missing a piece must fail here, not in the hands of
      # whoever downloads it.
      - name: Verify distribution
        shell: pwsh
        run: |
          $dist = "dist/${{ steps.version.outputs.name }}"
          $missing = @()

          # The CLI tools, the reader, and the WebEngine helper process the
          # reader cannot render a topic without.
          $required = @(
            'booinfo.exe', 'bootoc.exe', 'boorsrc.exe',
            'boorender.exe', 'bootrace.exe', 'boo2git.exe',
            'geist-hardcopy.exe', 'QtWebEngineProcess.exe',
            'Qt6WebEngineWidgets.dll', 'Qt6Widgets.dll'
          )
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $dist $file))) { $missing += $file }
          }

          # The shared library: `add_library(geist SHARED)` yields geist.dll
          # on MSVC, but accept either spelling rather than break on a rename.
          if (-not (Test-Path (Join-Path $dist 'LICENSE'))) {
            $missing += 'LICENSE'
          }

          # Test binaries are not part of a distribution.
          $strays = Get-ChildItem -Path $dist -Recurse -File |
            Where-Object { $_.Name -like '*_test.exe' -or
                           $_.Name -like '*benchmark*.exe' }
          if ($strays) {
            Write-Host "::error::Test binaries leaked into the distribution:"
            $strays | ForEach-Object { Write-Host "  $($_.Name)" }
            exit 1
          }
          if (-not (Test-Path (Join-Path $dist 'geist.dll')) -and
              -not (Test-Path (Join-Path $dist 'libgeist.dll'))) {
            $missing += 'geist.dll'
          }

          if ($missing.Count -gt 0) {
            throw "Distribution is missing: $($missing -join ', ')"
          }

          # The Apache module does not exist yet and must never be shipped
          # here even once it does.
          # Binaries only: a stray licence or notice file mentioning Apache
          # is not an Apache module and must not fail the build.
          $forbidden = Get-ChildItem -Path $dist -Recurse -File |
            Where-Object { $_.Extension -in '.dll', '.so', '.exe' } |
            Where-Object { $_.Name -like 'mod_*' -or $_.Name -like '*apache*' }
          if ($forbidden) {
            throw "Distribution contains an Apache module: $($forbidden.Name -join ', ')"
          }

          $size = (Get-ChildItem -Path $dist -Recurse -File |
                   Measure-Object -Property Length -Sum).Sum
          Write-Host "Distribution verified: $([math]::Round($size / 1MB, 1)) MB"

      - name: Create zip
        shell: pwsh
        run: |
          $name = "${{ steps.version.outputs.name }}"
          Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip" -Force
          $zip = Get-Item "$name.zip"
          Write-Host "$($zip.Name): $([math]::Round($zip.Length / 1MB, 1)) MB"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash |
            Out-File -FilePath "$name.zip.sha256" -Encoding ascii

      # Uploaded on every run, tag or not, so the package can be downloaded
      # and checked before a release is ever cut.
      #
      # The distribution directory is uploaded, not the zip: upload-artifact
      # always zips what it is given, so handing it the zip yields a zip
      # inside a zip. Giving it the directory makes GitHub's own wrapper the
      # distribution. The zip itself is still built, for the release asset,
      # where nothing wraps it.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: dist/${{ steps.version.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      # Only a tag publishes. Creating the release is skipped when one already
      # exists, and the upload clobbers, so re-running a tag build is safe.
      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A missing release is an expected outcome here, not an error, so
          # gh's exit code has to be inspectable rather than fatal.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $tag = "${{ steps.version.outputs.version }}"
          $name = "${{ steps.version.outputs.name }}"

          gh release view $tag 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating release $tag"
            gh release create $tag --title $tag --generate-notes
            if ($LASTEXITCODE -ne 0) {
              # The spec job may have created it between the check and the
              # create. That is a race, not a failure: what matters is that
              # the release exists now.
              gh release view $tag 2>&1 | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag" }
              Write-Host "Release $tag appeared concurrently; attaching to it"
            }
          } else {
            Write-Host "Release $tag already exists; attaching to it"
          }

          gh release upload $tag "$name.zip" "$name.zip.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload the distribution to $tag" }

  linux-appimage:
    name: Linux ${{ matrix.arch }} AppImage
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    # Both architectures are built on GitHub-hosted runners, natively rather
    # than under emulation: a QtWebEngine build in qemu takes hours. One
    # architecture failing must not cancel the other, so its artefact can
    # still be inspected.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            appimage_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            appimage_arch: aarch64

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
            publish=true
          else
            version="${GITHUB_SHA:0:7}"
            publish=false
          fi
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "name=geist-hardcopy-$version-linux-${{ matrix.arch }}"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version (publish a release: $publish)"

      # Qt comes from the distribution rather than from install-qt-action:
      # Qt publishes no official Linux arm64 binaries, so aqtinstall cannot
      # supply the arm64 half of this matrix and the two architectures would
      # otherwise be built against different Qt releases.
      #
      # libxcb-cursor0 is not pulled in by qt6-base-dev but Qt 6's xcb
      # platform plugin refuses to start without it, which would surface only
      # in the smoke test below.
      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            libpng-dev libgif-dev \
            qt6-base-dev qt6-base-dev-tools qt6-webengine-dev \
            libxcb-cursor0 xvfb file

      # GEIST_BUILD_GUI=ON, never AUTO: AUTO would quietly skip the reader if
      # Qt were missing and produce an AppImage-less run that still looked
      # successful. httpd is not wanted in a desktop artefact.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGEIST_BUILD_GUI=ON \
            -DGEIST_BUILD_APACHE=OFF

      # An explicit job count, never a bare --parallel: with the Makefiles
      # generator that becomes "make -j" with no number, and this tree
      # exhausts the runner's memory when it is unlimited.
      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel 4

      # One AppImage carries one application, so the AppDir holds the reader
      # and the library it links, and not the CLI tools: they are unreachable
      # from an AppImage's single entry point, and their presence makes
      # linuxdeploy resolve dependencies for binaries nobody can run.
      - name: Assemble the AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps

          cp build/gui/geist-hardcopy AppDir/usr/bin/
          cp -a build/libgeist.so* AppDir/usr/lib/
          cp gui/geist-hardcopy.desktop AppDir/usr/share/applications/
          cp gui/geist-hardcopy.svg \
            AppDir/usr/share/icons/hicolor/scalable/apps/

          find AppDir -type f | sort

      - name: Fetch linuxdeploy
        env:
          ARCH: ${{ matrix.appimage_arch }}
        run: |
          base=https://github.com/linuxdeploy
          curl -fsSL -o linuxdeploy.AppImage \
            "$base/linuxdeploy/releases/download/continuous/linuxdeploy-$ARCH.AppImage"
          curl -fsSL -o linuxdeploy-plugin-qt.AppImage \
            "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-$ARCH.AppImage"
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage

      # APPIMAGE_EXTRACT_AND_RUN, because a runner has no FUSE and an
      # AppImage cannot mount itself without it. LD_LIBRARY_PATH so that
      # linuxdeploy can resolve libgeist.so, which the reader links but which
      # is not on the system path.
      - name: Build the AppImage
        env:
          ARCH: ${{ matrix.appimage_arch }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QMAKE: /usr/bin/qmake6
        run: |
          export LD_LIBRARY_PATH="$PWD/AppDir/usr/lib:${LD_LIBRARY_PATH:-}"
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage \
            -d AppDir/usr/share/applications/geist-hardcopy.desktop \
            -i AppDir/usr/share/icons/hicolor/scalable/apps/geist-hardcopy.svg

          name="${{ steps.version.outputs.name }}"
          built=$(ls -1 ./*.AppImage | grep -v linuxdeploy | head -1)
          mv "$built" "$name.AppImage"
          sha256sum "$name.AppImage" > "$name.AppImage.sha256"
          ls -lh "$name.AppImage"

      # An AppImage that is missing a piece of the Qt WebEngine runtime starts
      # and then fails to render anything, which is exactly the failure a
      # download must not carry.
      - name: Verify the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          name="${{ steps.version.outputs.name }}"

          if [ ! -x "$name.AppImage" ]; then
            echo "::error::$name.AppImage was not produced"
            exit 1
          fi
          size=$(stat -c%s "$name.AppImage")
          if [ "$size" -lt 41943040 ]; then
            echo "::error::$name.AppImage is only $((size / 1024 / 1024)) MB; the Qt runtime is missing"
            exit 1
          fi

          rm -rf squashfs-root
          "./$name.AppImage" --appimage-extract > /dev/null

          missing=
          for path in \
            usr/bin/geist-hardcopy \
            usr/lib/libgeist.so \
            usr/libexec/QtWebEngineProcess \
            usr/resources/qtwebengine_resources.pak \
            usr/share/applications/geist-hardcopy.desktop
          do
            [ -e "squashfs-root/$path" ] || missing="$missing $path"
          done
          for lib in libQt6WebEngineWidgets libQt6Widgets libQt6PrintSupport; do
            ls squashfs-root/usr/lib/"$lib".so* > /dev/null 2>&1 ||
              missing="$missing $lib"
          done
          if [ -n "$missing" ]; then
            echo "::error::AppImage is missing:$missing"
            exit 1
          fi

          # It has to start, not merely contain the right files. The reader
          # opens a window and waits, so a timeout is the success case and
          # only a real failure exits non-zero before it.
          #
          # No arguments: the reader takes argv[1] as a book to open, so a
          # flag such as --no-sandbox would be read as a filename. Chromium's
          # sandbox needs privileges a container does not grant, so it is
          # turned off through the environment instead.
          set +e
          QTWEBENGINE_DISABLE_SANDBOX=1 QT_QPA_PLATFORM=xcb \
            xvfb-run -a timeout 40 "./$name.AppImage" > start.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "::error::The reader exited $status instead of starting"
            tail -40 start.log
            exit 1
          fi
          echo "AppImage verified: $((size / 1024 / 1024)) MB, starts cleanly"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: |
            ${{ steps.version.outputs.name }}.AppImage
            ${{ steps.version.outputs.name }}.AppImage.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.version }}"
          name="${{ steps.version.outputs.name }}"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "Creating release $tag"
            if ! gh release create "$tag" --title "$tag" --generate-notes; then
              # Another job may have created it between the check and the
              # create. That is a race, not a failure.
              if ! gh release view "$tag" >/dev/null 2>&1; then
                echo "::error::Could not create release $tag"
                exit 1
              fi
              echo "Release $tag appeared concurrently; attaching to it"
            fi
          else
            echo "Release $tag already exists; attaching to it"
          fi

          gh release upload "$tag" \
            "$name.AppImage" "$name.AppImage.sha256" --clobber

  linux-spec:
    name: BOO specification PDF
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
            publish=true
          else
            version="${GITHUB_SHA:0:7}"
            publish=false
          fi
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "name=boo-spec-$version"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version (publish a release: $publish)"

      # dblatex depends on the TeX stack, so it drags texlive in by itself;
      # asciidoc-dblatex is the pairing the specification is verified against.
      # libpng and libgif are the library's own dependencies.
      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc asciidoc-dblatex dblatex \
            libpng-dev libgif-dev

      # Neither Qt nor httpd is wanted here: this job exists for the library,
      # the CLI tools and the specification. Both are pinned OFF rather than
      # left at AUTO so the job cannot quietly change shape with the image.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGEIST_BUILD_GUI=OFF \
            -DGEIST_BUILD_APACHE=OFF 2>&1 | tee configure.log

          # doc/boo-spec only defines its target when the toolchain is found,
          # so a missing tool would otherwise surface as an obscure "no rule
          # to make target" much later.
          if ! grep -q "target 'boo-spec-pdf' available" configure.log; then
            echo "::error::The AsciiDoc toolchain is missing; boo-spec-pdf was not configured."
            grep "BOO format specification" configure.log || true
            exit 1
          fi

      # An explicit job count, never a bare --parallel: with the Makefiles
      # generator that becomes "make -j" with no number, which is unlimited.
      # This tree is ~166 template-heavy translation units, so unlimited
      # exhausts the runner's memory and the job dies with a SIGTERM and no
      # error of its own.
      - name: Build the library and tools
        run: cmake --build build --parallel "$(nproc)"

      - name: Build the specification
        run: cmake --build build --target boo-spec-pdf

      # A PDF that did not build, or built empty, must fail here rather than
      # be attached to a release.
      - name: Verify the outputs
        run: |
          for tool in booinfo bootoc boorsrc boorender bootrace boo2git; do
            if [ ! -x "build/$tool" ]; then
              echo "::error::CLI tool $tool was not built"
              exit 1
            fi
          done

          pdf=build/doc/boo-spec/boo-spec.pdf
          if [ ! -f "$pdf" ]; then
            echo "::error::The specification PDF was not produced at $pdf"
            exit 1
          fi
          if [ "$(head -c 4 "$pdf")" != "%PDF" ]; then
            echo "::error::$pdf is not a PDF"
            exit 1
          fi
          size=$(stat -c%s "$pdf")
          if [ "$size" -lt 51200 ]; then
            echo "::error::$pdf is only $size bytes; the build produced a stub"
            exit 1
          fi

          name="${{ steps.version.outputs.name }}"
          cp "$pdf" "$name.pdf"
          sha256sum "$name.pdf" > "$name.pdf.sha256"
          echo "$name.pdf: $((size / 1024)) KiB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: |
            ${{ steps.version.outputs.name }}.pdf
            ${{ steps.version.outputs.name }}.pdf.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.version }}"
          name="${{ steps.version.outputs.name }}"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "Creating release $tag"
            if ! gh release create "$tag" --title "$tag" --generate-notes; then
              # The Windows job may have created it between the check and the
              # create. That is a race, not a failure.
              if ! gh release view "$tag" >/dev/null 2>&1; then
                echo "::error::Could not create release $tag"
                exit 1
              fi
              echo "Release $tag appeared concurrently; attaching to it"
            fi
          else
            echo "Release $tag already exists; attaching to it"
          fi

          gh release upload "$tag" "$name.pdf" "$name.pdf.sha256" --clobber
