name: macOS universal DMG
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dmg:
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Test release verifier
        run: python3 tests/macos_release_verifier_test.py
      - name: Build universal dependencies for Ventura
        run: bash macos/build_release_dependencies.sh "$RUNNER_TEMP/geist-deps"
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_OBJCXX_FLAGS='-Werror=unguarded-availability-new' \
            -DGEIST_BUILD_MAC_READER=ON -DGEIST_BUILD_GUI=OFF \
            -DGEIST_BUILD_APACHE=OFF \
            -DPNG_LIBRARY="$RUNNER_TEMP/geist-deps/lib/libpng16.a" \
            -DPNG_PNG_INCLUDE_DIR="$RUNNER_TEMP/geist-deps/include" \
            -DGIF_LIBRARY="$RUNNER_TEMP/geist-deps/lib/libgif.a" \
            -DGIF_INCLUDE_DIR="$RUNNER_TEMP/geist-deps/include"
      - name: Build and test native architecture
        run: |
          cmake --build build --parallel 3
          ctest --test-dir build --output-on-failure --parallel 3
      - name: Test Intel slice under Rosetta
        run: |
          # Rosetta exercises the Intel library slice, not Ventura compatibility.
          arch -x86_64 build/booinfo tests/fixtures/packet.boo
          arch -x86_64 build/boorender tests/fixtures/packet.boo 1.3 --html > "$RUNNER_TEMP/intel.html"
          test -s "$RUNNER_TEMP/intel.html"
      - name: Verify bundle and create DMG
        id: package
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          app='build/macos/Geist BOO Reader.app'
          mkdir -p "$app/Contents/Resources/ThirdPartyLicenses"
          cp "$RUNNER_TEMP/geist-deps/licenses/"*.txt "$app/Contents/Resources/ThirdPartyLicenses/"
          cp macos/RELEASE-NOTES.txt "$app/Contents/Resources/Experimental-build.txt"
          # Resource additions invalidate the earlier ad-hoc seal.
          codesign --force --sign - "$app"
          codesign --verify --strict --deep "$app"
          executable="$app/Contents/MacOS/Geist BOO Reader"
          lipo "$executable" -verify_arch arm64 x86_64
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = 13.0
          # Static third-party libraries mean only Apple system imports remain.
          python3 macos/verify_release.py "$app"
          version="${GITHUB_SHA:0:7}"
          if [ "$REF_TYPE" = tag ]; then version="$REF_NAME"; fi
          name="geist-$version-macos-universal-experimental"
          stage="$RUNNER_TEMP/geist-dmg"
          mkdir "$stage"
          ditto "$app" "$stage/Geist BOO Reader.app"
          cp macos/RELEASE-NOTES.txt "$stage/READ ME.txt"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname 'Geist BOO Reader' -srcfolder "$stage" -format UDZO "$name.dmg"
          hdiutil verify "$name.dmg"
          shasum -a 256 "$name.dmg" > "$name.dmg.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.dmg
            ${{ steps.package.outputs.name }}.dmg.sha256
          if-no-files-found: error
      - name: Attach to release with experimental-build warning
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ASSET_NAME: ${{ steps.package.outputs.name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes || gh release view "$RELEASE_TAG"
          fi
          notes="$RUNNER_TEMP/geist-release-notes.txt"
          gh release view "$RELEASE_TAG" --json body --jq '.body' > "$notes"
          if ! grep -Fq '### Experimental macOS download' "$notes"; then
            cat macos/RELEASE-NOTES.txt >> "$notes"
            gh release edit "$RELEASE_TAG" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" "$ASSET_NAME.dmg" "$ASSET_NAME.dmg.sha256"
